<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YONA Member Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #222;
    }

    .header {
      background: #075eaa;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .photo {
      width: 135px;
      height: 135px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #075eaa;
      margin: 15px auto;
      display: none;
    }

    .member-name {
      font-size: 25px;
      font-weight: bold;
      margin: 12px 0 5px;
    }

    .position {
      color: #075eaa;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .info {
      text-align: left;
      border-top: 1px solid #ddd;
      margin-top: 15px;
      padding-top: 10px;
    }

    .info p {
      margin: 13px 0;
      line-height: 1.4;
    }

    .label {
      font-weight: bold;
    }

    .verified {
      margin-top: 22px;
      padding: 13px;
      background: #e8f7ed;
      color: #187a3d;
      border-radius: 8px;
      font-weight: bold;
    }

    .loading {
      color: #555;
      padding: 25px 10px;
      font-size: 16px;
    }

    .error {
      color: #b00020;
      background: #fff0f0;
      border-radius: 8px;
      padding: 18px;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>YONA</h1>
    <p>Youths of Ndasei Association</p>
    <p>Unity and Development</p>
  </div>


  <div class="container">

    <div class="card">

      <!-- YONA LOGO -->
      <img
        src="LOGO"
        class="logo"
        alt="YONA Logo"
        onerror="this.style.display='none'"
      >


      <!-- LOADING -->
      <div id="loading" class="loading">
        Verifying YONA member...
      </div>


      <!-- MEMBER DETAILS -->
      <div id="memberContent" class="hidden">

        <img
          id="memberPhoto"
          class="photo"
          alt="Member Photo"
        >


        <div
          id="memberName"
          class="member-name">
        </div>


        <div
          id="memberPosition"
          class="position">
        </div>


        <div class="info">

          <p>
            <span class="label">
              Member Number:
            </span>
            <span id="memberNumber">
              N/A
            </span>
          </p>


          <p>
            <span class="label">
              Phone:
            </span>
            <span id="memberPhone">
              N/A
            </span>
          </p>


          <p>
            <span class="label">
              Member Type:
            </span>
            <span id="memberType">
              N/A
            </span>
          </p>


          <p>
            <span class="label">
              Expiry Date:
            </span>
            <span id="expiryDate">
              N/A
            </span>
          </p>

        </div>


        <div class="verified">
          ✓ YONA MEMBER VERIFIED
        </div>

      </div>


      <!-- ERROR -->
      <div
        id="error"
        class="error hidden">
      </div>

    </div>


    <div class="footer">
      YOUTHS OF NDASEI ASSOCIATION<br>
      Unity and Development
    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================
       SUPABASE CONFIGURATION
    ========================= */

    const SUPABASE_URL =
      'https://atxeeymireukwbbsczbv.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_Qc3DSCrNuXWmeVOqK_CKoQ_Z_CitoTc';


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       SHOW ERROR
    ========================= */

    function showError(message) {

      const loading =
        document.getElementById(
          'loading'
        );

      const error =
        document.getElementById(
          'error'
        );

      loading.classList.add(
        'hidden'
      );

      error.textContent =
        message;

      error.classList.remove(
        'hidden'
      );

    }


    /* =========================
       VERIFY MEMBER
    ========================= */

    async function verifyMember() {

      try {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const memberId =
          params.get('id');


        /* No ID in QR link */

        if (!memberId) {

          showError(
            'No member ID was provided. Please scan a valid YONA member QR code.'
          );

          return;

        }


        /* Get member from Supabase */

        const result =
          await supabaseClient
            .from('members')
            .select(
              'id,name,phone,position,member_type,member_number,expiry_date,photo_url'
            )
            .eq(
              'id',
              memberId
            )
            .single();


        const data =
          result.data;

        const error =
          result.error;


        /* Supabase error */

        if (error) {

          console.error(
            'Supabase error:',
            error
          );

          showError(
            'Member could not be verified. The member record may not exist or cannot be accessed.'
          );

          return;

        }


        /* No member */

        if (!data) {

          showError(
            'Member record was not found.'
          );

          return;

        }


        /* Hide loading */

        document
          .getElementById(
            'loading'
          )
          .classList.add(
            'hidden'
          );


        /* Show member */

        document
          .getElementById(
            'memberContent'
          )
          .classList.remove(
            'hidden'
          );


        /* Name */

        document
          .getElementById(
            'memberName'
          )
          .textContent =
            data.name ||
            'N/A';


        /* Position */

        document
          .getElementById(
            'memberPosition'
          )
          .textContent =
            data.position ||
            'Member';


        /* Member number */

        document
          .getElementById(
            'memberNumber'
          )
          .textContent =
            data.member_number ||
            'N/A';


        /* Phone */

        document
          .getElementById(
            'memberPhone'
          )
          .textContent =
            data.phone ||
            'N/A';


        /* Member type */

        document
          .getElementById(
            'memberType'
          )
          .textContent =
            data.member_type ||
            'Member';


        /* Expiry */

        document
          .getElementById(
            'expiryDate'
          )
          .textContent =
            data.expiry_date ||
            'N/A';


        /* Member photo */

        if (
          data.photo_url &&
          data.photo_url.trim() !== ''
        ) {

          const photo =
            document.getElementById(
              'memberPhoto'
            );

          photo.src =
            data.photo_url;

          photo.style.display =
            'block';

        }


      } catch (error) {

        console.error(
          'Verification error:',
          error
        );

        showError(
          'Unable to connect to the YONA verification system.'
        );

      }

    }


    /* =========================
       START VERIFICATION
    ========================= */

    verifyMember();

  </script>

</body>
</html>
