<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YONA App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #222;
    }

    header {
      background: #075eaa;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .dashboard button {
      border: none;
      border-radius: 12px;
      background: white;
      min-height: 80px;
      font-size: 17px;
      font-weight: bold;
      color: #075eaa;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .dashboard button:hover {
      background: #eaf4ff;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 10px 20px 30px;
    }

    .section {
      display: none;
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-top: 0;
      color: #075eaa;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button.primary {
      background: #075eaa;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    button.secondary {
      background: #777;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    button.danger {
      background: #c62828;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.edit {
      background: #ef8f00;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .record {
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 14px;
      margin-top: 12px;
      background: #fafafa;
    }

    .record strong {
      color: #075eaa;
    }

    .record-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 7px;
      display: none;
      font-weight: bold;
    }

    .status.success {
      display: block;
      background: #d9f5df;
      color: #176b2c;
    }

    .status.error {
      display: block;
      background: #ffe0e0;
      color: #a00000;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      .dashboard {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 15px;
      }

      .dashboard button {
        min-height: 75px;
        font-size: 15px;
      }

      .container {
        padding: 5px 15px 25px;
      }

      .section {
        padding: 15px;
      }
    }

    @media (max-width: 420px) {

      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard button {
        min-height: 70px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <h1>YONA App</h1>
    <p>Youths of Ndasei Association</p>
    <p>Unity and Development</p>
  </header>


  <!-- DASHBOARD -->

  <div class="dashboard">

    <button onclick="showSection('membersSection')">
      👥<br>
      Members
    </button>

    <button onclick="showSection('executiveSection')">
      👔<br>
      Executive
    </button>

    <button onclick="showSection('financeSection')">
      💰<br>
      Finance
    </button>

    <button onclick="showSection('meetingsSection')">
      📅<br>
      Meetings
    </button>

    <button onclick="showSection('eventsSection')">
      🎉<br>
      Events
    </button>

    <button onclick="showSection('documentsSection')">
      📄<br>
      Documents
    </button>

  </div>


  <div class="container">

    <!-- =========================
         MEMBERS
    ========================= -->

    <section id="membersSection" class="section">

      <h2>Members</h2>

      <div id="memberStatus" class="status"></div>

      <div class="form-group">

      <div class="form-group">

      </div>

      <div class="form-group">
        <label>Position</label>
        <input
          id="memberPosition"
          type="text"
          placeholder="Enter position">
      </div>

      <div class="form-buttons">

        <button
          class="primary"
          onclick="saveMember()">
          Save Member

        <button
          class="secondary"

          Clear
        </button>

      <div id="membersList"></div>

    </section>


    <!-- =========================
         EXECUTIVE
    ========================= -->

    <section id="executiveSection" class="section">

      <h2>Executive Leadership</h2>

      <div id="executiveStatus" class="status"></div>

      <div class="form-group">
        <label>Name</label>

        <input
          id="executiveName"
          type="text"
          placeholder="Enter name">
      </div>

      <div class="form-group">
        <label>Position</label>

        <input
          id="executivePosition"
          type="text"
          placeholder="Enter position">
      </div>

      <div class="form-group">
        <label>Phone</label>

        <input
          id="executivePhone"
          type="text"
          placeholder="Enter phone">
      </div>

      <div class="form-buttons">

        <button
          class="primary"
          onclick="saveExecutive()">
          Save Executive
        </button>

        <button
          class="secondary"
          onclick="clearExecutiveForm()">
          Clear

      </div>

    </section>


    <!-- =========================
         FINANCE
    ========================= -->

    <section id="financeSection" class="section">

      <h2>Finance</h2>

      <div id="financeStatus" class="status"></div>

      <div class="form-group">
        <label>Name</label>

        <input

          type="text"
          placeholder="Enter name">
      </div>

      <div class="form-group">

        <label>Category</label>

        <select id="financeCategory">

          <option value="Monthly Contribution">
            Monthly Contribution
          </option>

          <option value="End of Year Contribution">
            End of Year Contribution
          </option>

          <option value="Welfare">
            Welfare
          </option>

          <option value="Other">
            Other

        </select>

      </div>

      <div class="form-group">

        <label>Amount</label>

        <input

          step="0.01"

      </div>

      <div class="form-group">

        <label>Description</label>

        <textarea
          id="financeDescription"

      </div>

      <div class="form-buttons">

        <button
          class="primary"
          onclick="saveFinance()">
          Save Transaction
        </button>

        <button
          class="secondary"
          onclick="clearFinanceForm()">
          Clear
        </button>

      </div>

      <div id="financeList"></div>

    </section>


    <!-- =========================
         MEETINGS
    ========================= -->

    <section id="meetingsSection" class="section">

      <h2>Meetings</h2>

      <div id="meetingStatus" class="status"></div>

      <div class="form-group">

        <label>Date</label>

        <input
          id="meetingDate"
          type="date">

      </div>

      <div class="form-group">

        <label>Meeting Title</label>

        <input
          id="meetingTitle"
          type="text"
          placeholder="Enter meeting title">

      </div>

      <div class="form-group">

        <label>Location</label>

        <input
          id="meetingLocation"
          type="text"
          placeholder="Enter meeting location">

      </div>

      <div class="form-buttons">

        <button
          class="primary"
          onclick="saveMeeting()">
          Save Meeting
        </button>

        <button
          class="secondary"
          onclick="clearMeetingForm()">
          Clear

      <div id="meetingsList"></div>

    <!-- =========================
         EVENTS
    ========================= -->

    <section id="eventsSection" class="section">

      <h2>Events</h2>

      <div id="eventStatus" class="status"></div>

      <div class="form-group">

        <label>Event Title</label>

        <input

      </div>

      <div class="form-group">

        <label>Date</label>

        <input
          id="eventDate"
          type="date">

      </div>

      <div class="form-group">

        <label>Location</label>

        <input
          id="eventLocation"
          type="text"
          placeholder="Enter event location">

      </div>

      <div class="form-group">

        <label>Description</label>

        <textarea
          id="eventDescription"
          placeholder="Enter event description"></textarea>

      </div>

      <div class="form-buttons">

        <button
          class="primary"
          onclick="saveEvent()">
          Save Event
        </button>

        <button
          class="secondary"
          onclick="clearEventForm()">
          Clear
        </button>

      </div>

      <div id="eventsList"></div>

    </section>


    <!-- =========================
         DOCUMENTS
    ========================= -->

    <section id="documentsSection" class="section">

      <h2>Documents</h2>

      <div id="documentStatus" class="status"></div>

      <h3>Create Typed Document</h3>

      <div class="form-group">

        <label>Document Title</label>

        <input
          id="documentTitle"
          type="text"
          placeholder="Enter document title">

      </div>

      <div class="form-group">

        <label>Document Content</label>

        <textarea
          id="documentContent"
          placeholder="Type your document here"></textarea>

      </div>

      <div class="form-buttons">

        <button
          class="primary"
          onclick="saveTypedDocument()">
          Save Document
        </button>

        <button
          class="secondary"
          onclick="clearDocumentForm()">
          Clear
        </button>

      </div>

      <hr>

      <h3>Upload Document</h3>

      <div class="form-group">

        <label>Select File</label>

        <input
          id="documentFile"

      <button

        onclick="uploadDocument()">

      </button>

      <div id="documentsList"></div>

  </div>


  <!-- FOOTER -->

  <footer>
    YOUTHS OF NDASEI ASSOCIATION (YONA)<br>
    Unity and Development
  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* ==========================================
       SUPABASE CONNECTION
    ========================================== */

    const SUPABASE_URL =
      "https://atxeeymireukwbbsczbv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Qc3DSCrNuXWmeVOqK_CKoQ_Z_CitoTc";

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const DOCUMENT_BUCKET =
      "yona-documents";


    /* ==========================================
       GLOBAL EDIT IDs
    ========================================== */

    let editingMemberId = null;
    let editingExecutiveId = null;
    let editingFinanceId = null;
    let editingMeetingId = null;
    let editingEventId = null;


    /* ==========================================
       NAVIGATION
    ========================================== */

    function showSection(sectionId) {

      document
        .querySelectorAll(".section")
        .forEach(section => {
          section.classList.remove("active");
        });

      const section =
        document.getElementById(sectionId);

      if (section) {
        section.classList.add("active");
      }

      if (sectionId === "membersSection") {
        loadMembers();
      }

      if (sectionId === "executiveSection") {
        loadExecutive();
      }

      if (sectionId === "financeSection") {
        loadFinance();
      }

      if (sectionId === "meetingsSection") {
        loadMeetings();
      }

      if (sectionId === "eventsSection") {
        loadEvents();
      }

      if (sectionId === "documentsSection") {
        loadDocuments();
      }
    }


    /* ==========================================
       STATUS MESSAGE
    ========================================== */

    function showStatus(
      elementId,
      message,
      type
    ) {

      const element =
        document.getElementById(elementId);

      if (!element) return;

      element.textContent = message;

      element.className =
        "status " + type;

      setTimeout(() => {
        element.className = "status";
      }, 4000);
    }


    /* ==========================================
       HTML SECURITY
    ========================================== */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeJs(value) {

      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }


    /* ==========================================
       JSON HELPER
    ========================================== */

    function readJsonValue(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      if (typeof value !== "string") {
        return String(value);
      }

      try {
        return JSON.parse(value);
      } catch {
        return value;
      }
    }


    /* ==========================================
       MEMBERS
    ========================================== */

    async function loadMembers() {

      const { data, error } =
        await db
          .from("members")
          .select("*")
          .order("id", {
            ascending: false
          });

      if (error) {

        showStatus(
          "memberStatus",
          "Could not load members: " +
          error.message,
          "error"
        );

        return;
      }

      const list =
        document.getElementById(
          "membersList"
        );

      list.innerHTML = "";

      (data || []).forEach(member => {

        const name =
          readJsonValue(member.name);

        const phone =
          readJsonValue(member.phone);

        const position =
          readJsonValue(member.position);

        list.innerHTML += `
          <div class="record">

            <strong>
              ${escapeHtml(name)}
            </strong>
            <br>

            Phone:
            ${escapeHtml(phone)}
            <br>

            Position:
            ${escapeHtml(position)}

            <div class="record-actions">

              <button
                class="edit"
                onclick="editMember(
                  ${member.id},
                  '${escapeJs(name)}',
                  '${escapeJs(phone)}',
                  '${escapeJs(position)}'
                )">
                Edit
              </button>

              <button
                class="danger"
                onclick="deleteMember(
                  ${member.id}
                )">
                Delete
              </button>

            </div>

          </div>
        `;
      });
    }


    async function saveMember() {

      const name =
        document
          .getElementById("memberName")
          .value
          .trim();

      const phone =
        document
          .getElementById("memberPhone")
          .value
          .trim();

      const position =
        document
          .getElementById("memberPosition")
          .value
          .trim();

      if (!name) {

        showStatus(
          "memberStatus",
          "Please enter the member name.",
          "error"
        );

        return;
      }

      let result;

      if (editingMemberId) {

        result =
          await db
            .from("members")
            .update({
              name: JSON.stringify(name),
              phone: JSON.stringify(phone),
              position: JSON.stringify(position)
            })
            .eq(
              "id",
              editingMemberId
            );

      } else {

        result =
          await db
            .from("members")
            .insert({
              name: JSON.stringify(name),
              phone: JSON.stringify(phone),
              position: JSON.stringify(position)
            });
      }

      if (result.error) {

        showStatus(
          "memberStatus",
          "Could not save member: " +
          result.error.message,
          "error"
        );

        return;
      }

      showStatus(
        "memberStatus",
        editingMemberId
          ? "Member updated successfully."
          : "Member saved successfully.",
        "success"
      );

      clearMemberForm();

      loadMembers();
    }


    function editMember(
      id,
      name,
      phone,
      position
    ) {

      editingMemberId = id;

      document
        .getElementById("memberName")
        .value = name;

      document
        .getElementById("memberPhone")
        .value = phone;

      document
        .getElementById("memberPosition")
        .value = position;
    }


    async function deleteMember(id) {

      if (
        !confirm(
          "Delete this member?"
        )
      ) {
        return;
      }

      const { error } =
        await db
          .from("members")
          .delete()
          .eq("id", id);

      if (error) {

        showStatus(
          "memberStatus",
          "Could not delete member: " +
          error.message,
          "error"
        );

        return;
      }

      showStatus(
        "memberStatus",
        "Member deleted successfully.",
        "success"
      );

      loadMembers();
    }


    function clearMemberForm() {

      editingMemberId = null;

      document
        .getElementById("memberName")
        .value = "";

      document
        .getElementById("memberPhone")
        .value = "";

      document
        .getElementById("memberPosition")
        .value = "";
    }


    /* ==========================================
       EXECUTIVE
    ========================================== */

    async function loadExecutive() {

      const { data, error } =
        await db
          .from("executive")
          .select("*")
          .order("id", {
            ascending: false
          });

      if (error) {

        showStatus(
          "executiveStatus",
          "Could not load executive: " +
          error.message,
          "error"
        );

        return;
      }

      const list =
        document.getElementById(
          "executiveList"
        );

      list.innerHTML = "";

      (data || []).forEach(item => {

        const name =
          readJsonValue(item.name);

        const position =
          readJsonValue(item.position);

        const phone =
          readJsonValue(item.phone);

        list.innerHTML += `
          <div class="record">

            <strong>
              ${escapeHtml(name)}
            </strong>
            <br>

            Position:
            ${escapeHtml(position)}
            <br>

            Phone:
            ${escapeHtml(phone)}

            <div class="record-actions">

              <button
                class="edit"
                onclick="editExecutive(
                  ${item.id},
                  '${escapeJs(name)}',
                  '${escapeJs(position)}',
                  '${escapeJs(phone)}'
                )">
                Edit
              </button>

              <button
                class="danger"
                onclick="deleteExecutive(
                  ${item.id}
                )">
                Delete
              </button>

            </div>

          </div>
        `;
      });
    }


    async function saveExecutive() {

      const name =
        document
          .getElementById("executiveName")
          .value
          .trim();

      const position =
        document
          .getElementById("executivePosition")
          .value
          .trim();

      const phone =
        document
          .getElementById("executivePhone")
          .value
          .trim();

      if (!name) {

        showStatus(
          "executiveStatus",
          "Please enter the executive name.",
          "error"
        );

        return;
      }

      const values = {

        name:
          JSON.stringify(name),

        position:
          JSON.stringify(position),

        phone:
          JSON.stringify(phone)
      };

      let result;

      if (editingExecutiveId) {

        result =
          await db
            .from("executive")
            .update(values)
            .eq(
              "id",
              editingExecutiveId
            );

      } else {

        result =
          await db
            .from("executive")
            .insert(values);
      }

      if (result.error) {

        showStatus(
          "executiveStatus",
          "Could not save executive: " +
          result.error.message,
          "error"
        );

        return;
      }

      showStatus(
        "executiveStatus",
        editingExecutiveId
          ? "Executive updated successfully."
          : "Executive saved successfully.",
        "success"
      );

      clearExecutiveForm();

      loadExecutive();
    }


    function editExecutive(
      id,
      name,
      position,
      phone
    ) {

      editingExecutiveId = id;

      document
        .getElementById("executiveName")
        .value = name;

      document
        .getElementById("executivePosition")
        .value = position;

      document
        .getElementById("executivePhone")
        .value = phone;
    }


    async function deleteExecutive(id) {

      if (
        !confirm(
          "Delete this executive record?"
        )
      ) {
        return;
      }

      const { error } =
        await db
          .from("executive")
          .delete()
          .eq("id", id);

      if (error) {

        showStatus(
          "executiveStatus",
          "Could not delete executive: " +
          error.message,
          "error"
        );

        return;
      }

      showStatus(
        "executiveStatus",
        "Executive deleted successfully.",
        "success"
      );

      loadExecutive();
    }


    function clearExecutiveForm() {

      editingExecutiveId = null;

      document
        .getElementById("executiveName")
        .value = "";

      document
        .getElementById("executivePosition")
        .value = "";

      document
        .getElementById("executivePhone")
        .value = "";
    }


    /* ==========================================
       FINANCE
       IMPORTANT:
       amount is sent as a NUMBER, NOT JSON STRING
    ========================================== */

    async function loadFinance() {

      const { data, error } =
        await db
          .from("finance")
          .select("*")
          .order("id", {
            ascending: false
          });

      if (error) {

        showStatus(
          "financeStatus",
          "Could not load finance records: " +
          error.message,
          "error"
        );

        return;
      }

      const list =
        document.getElementById(
          "financeList"
        );

      list.innerHTML = "";

      (data || []).forEach(item => {

        const name =
          readJsonValue(item.name);

        const category =
          readJsonValue(item.category);

        const amount =
          item.amount;

        const description =
          readJsonValue(item.description);

        list.innerHTML += `
          <div class="record">

            <strong>
              ${escapeHtml(name)}
            </strong>
            <br>

            Category:
            ${escapeHtml(category)}
            <br>

            Amount:
            ${escapeHtml(amount)}
            <br>

            Description:
            ${escapeHtml(description)}

            <div class="record-actions">

              <button
                class="edit"
                onclick="editFinance(
                  ${item.id},

    async function loadDocuments() {

      const list =
        document.getElementById(
          "documentsList"
        );

      list.innerHTML =
        "<p>Loading documents...</p>";


      const {
        data: databaseDocuments,
        error: databaseError
      } =
        await db
          .from("documents")
          .select("*")
          .order("id", {
            ascending: false
          });


      if (databaseError) {

        showStatus(
          "documentStatus",
          "Could not load typed documents: " +
          databaseError.message,
          "error"
        );

        list.innerHTML = "";

        return;
      }


      list.innerHTML =
        "<h3>Saved Documents</h3>";


      (databaseDocuments || []).forEach(
        documentItem => {

          list.innerHTML += `
            <div class="record">

              <strong>
                ${escapeHtml(
                  documentItem.title
                )}
              </strong>
              <br>

              Type:
              ${escapeHtml(
                documentItem.type
              )}

              <div class="record-actions">

                <button
                  class="primary"
                  onclick="openTypedDocument(
                    ${documentItem.id}
                  )">
                  Open
                </button>

                <button
                  class="danger"
                  onclick="deleteTypedDocument(
                    ${documentItem.id}
                  )">
                  Delete
                </button>

              </div>

            </div>
          `;
        }
      );


      const {
        data: files,
        error: storageError
      } =
        await db
          .storage
          .from(DOCUMENT_BUCKET)
          .list("", {
            limit: 100
          });


      if (storageError) {

        showStatus(
          "documentStatus",
          "Could not load uploaded files: " +
          storageError.message,
          "error"
        );

        return;
      }


      if (
        files &&
        files.length > 0
      ) {

        list.innerHTML +=
          "<h3>Uploaded Files</h3>";

        files.forEach(file => {

          if (!file.name) return;

          list.innerHTML += `
            <div class="record">

              <strong>
                ${escapeHtml(file.name)}
              </strong>

              <div class="record-actions">

                <button
                  class="primary"
                  onclick="openDocument(
                    '${escapeJs(file.name)}'
                  )">
                  Open
                </button>

                <button
                  class="danger"
                  onclick="deleteDocument(
                    '${escapeJs(file.name)}'
                  )">
                  Delete
                </button>

              </div>

            </div>
          `;
        });
      }
    }

    /* ==========================================
       OPEN TYPED DOCUMENT
    ========================================== */

    async function openTypedDocument(id) {

      const {
        data,
        error
      } =
        await db
          .from("documents")
          .select("*")
          .eq("id", id)
          .single();


      if (error) {

        showStatus(
          "documentStatus",
          "Could not open document: " +
          error.message,
          "error"
        );

        return;
      }


      const newWindow =
        window.open(
          "",
          "_blank"
        );


      if (!newWindow) {

        showStatus(
          "documentStatus",
          "Please allow pop-ups to open the document.",
          "error"
        );

        return;
      }


      newWindow.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

          <title>
            ${escapeHtml(
              data.title
            )}
          </title>

          <style>

            body {
              font-family: Arial, sans-serif;
              padding: 30px;
              line-height: 1.6;
            }

            h1 {
              color: #075eaa;
            }

            .content {
              white-space: pre-wrap;
            }

          </style>

        </head>

        <body>

          <h1>
            ${escapeHtml(
              data.title
            )}
          </h1>

          <div class="content">
            ${escapeHtml(
              data.content
            )}
          </div>

        </body>

        </html>

      `);

      newWindow.document.close();
    }

    /* ==========================================
       UPLOAD FILE
    ========================================== */

    async function uploadDocument() {

      const fileInput =
        document.getElementById(
          "documentFile"
        );

      const file =
        fileInput.files[0];

      if (!file) {

        showStatus(
          "documentStatus",
          "Please select a file first.",
          "error"
        );

        return;
      }


      const filePath =
        Date.now() +
        "_" +
        file.name;


      const {
        error: uploadError
      } =
        await db
          .storage
          .from(DOCUMENT_BUCKET)
          .upload(
            filePath,
            file
          );


      if (uploadError) {

        showStatus(
          "documentStatus",
          "Could not upload file: " +
          uploadError.message,
          "error"
        );

        return;
      }


      const {
        error: databaseError
      } =
        await db
          .from("documents")
          .insert({

            title: file.name,

            type: "Uploaded File",

            content: filePath

          });


      if (databaseError) {

        /* Remove uploaded file if database save fails */

        await db
          .storage
          .from(DOCUMENT_BUCKET)
          .remove([
            filePath
          ]);

        showStatus(
          "documentStatus",
          "File uploaded but database record failed: " +
          databaseError.message,
          "error"
        );

        return;
      }


      showStatus(
        "documentStatus",
        "File uploaded successfully.",
        "success"
      );

      fileInput.value = "";

      loadDocuments();
    }


    /* ==========================================
       OPEN UPLOADED FILE
    ========================================== */

    async function openDocument(fileName) {

      const {
        data,
        error
      } =
        await db
          .storage
          .from(DOCUMENT_BUCKET)
          .createSignedUrl(
            fileName,
            3600
          );


      if (error) {

        showStatus(
          "documentStatus",
          "Could not open file: " +
          error.message,
          "error"
        );

        return;
      }


      window.open(
        data.signedUrl,
        "_blank"
      );
    }


    /* ==========================================
       DELETE UPLOADED FILE
    ========================================== */

    async function deleteDocument(fileName) {

      if (
        !confirm(
          "Delete this uploaded file?"
        )
      ) {
        return;
      }


      const {
        error: storageError
      } =
        await db
          .storage
          .from(DOCUMENT_BUCKET)
          .remove([
            fileName
          ]);


      if (storageError) {

        showStatus(
          "documentStatus",
          "Could not delete file: " +
          storageError.message,
          "error"
        );

        return;
      }


      const {
        error: databaseError
      } =
        await db
          .from("documents")
          .delete()
          .eq(
            "content",
            fileName
          );


      if (databaseError) {

        showStatus(
          "documentStatus",
          "File deleted, but database record could not be deleted: " +
          databaseError.message,
          "error"
        );

        return;
      }


      showStatus(
        "documentStatus",
        "File deleted successfully.",
        "success"
      );

      loadDocuments();
    }
