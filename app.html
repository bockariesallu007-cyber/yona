<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YONA App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #222;
    }

    header {
      background: #0b4f9c;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 20px auto;
    }

    .login-box {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .login-box h2 {
      margin-top: 0;
      color: #0b4f9c;
      text-align: center;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    button {
      background: #0b4f9c;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      margin: 3px;
    }

    button:hover {
      opacity: .9;
    }

    button.secondary {
      background: #777;
    }

    button.danger {
      background: #c62828;
    }

    button.success {
      background: #198754;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .dashboard button {
      min-height: 80px;
      font-size: 16px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .section h2 {
      color: #0b4f9c;
      margin-top: 0;
      border-bottom: 2px solid #e5e5e5;
      padding-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .record {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .record h3 {
      margin-top: 0;
      color: #0b4f9c;
    }

    .record-group {
      margin-top: 15px;
    }

    .record-group-title {
      background: #0b4f9c;
      color: white;
      padding: 9px 12px;
      border-radius: 7px;
      font-weight: bold;
    }

    .record-actions {
      margin-top: 12px;
    }

    .person-photo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #0b4f9c;
      display: block;
      margin-bottom: 10px;
    }

    .no-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      color: #777;
      font-size: 12px;
    }

    .photo-preview {
      max-width: 150px;
      max-height: 150px;
      border-radius: 8px;
      margin-top: 5px;
      display: none;
    }

    .period-box {
      margin-bottom: 20px;
    }

    .period-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      cursor: pointer;
    }

    .period-item:hover {
      background: #eef5ff;
    }

    .document-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 10px;
      border-radius: 7px;
      margin: 10px 0;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }

    @media (max-width: 500px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .container {
        width: 96%;
      }

      .section {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>

<div class="container">

  <script>
/* ================================
   SUPABASE CONFIGURATION
================================ */

const SUPABASE_URL =
  "https://atxeeymireukwbbsczbv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qc3DSCrNuXWmeVOqK_CKoQ_Z_CitoTc";

const DOCUMENT_BUCKET =
  "yona-documents";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* ================================
   EDITING VARIABLES
================================ */

let editingMemberId = null;
let editingMemberOldPhoto = null;

let editingExecutiveId = null;
let editingExecutiveOldPhoto = null;

let editingFinanceId = null;

let editingMeetingId = null;
let editingMeetingOldPhoto = null;

let editingEventId = null;


/* ================================
   GENERAL MESSAGE FUNCTION
================================ */

function showMessage(elementId, message, type = "success") {

  const element = document.getElementById(elementId);

  if (!element) return;

  element.innerHTML =
    `<div class="message">${message}</div>`;

  setTimeout(() => {
    element.innerHTML = "";
  }, 5000);
}


/* ================================
   LOGIN
================================ */

async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.innerHTML =
      `<div class="message">Please enter email and password.</div>`;

    return;
  }

  message.innerHTML =
    `<div class="message">Logging in...</div>`;

  try {

    const { data, error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      throw error;
    }

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    message.innerHTML = "";

  } catch (error) {

    message.innerHTML =
      `<div class="message">
        Login failed: ${escapeHtml(error.message)}
      </div>`;
  }
}


/* ================================
   LOGOUT
================================ */

async function logout() {

  await db.auth.signOut();

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("loginEmail").value = "";
  document.getElementById("loginPassword").value = "";
}


/* ================================
   CHECK USER
================================ */

async function checkUser() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

  } else {

    document.getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");
  }
}


/* ================================
   AUTH STATE
================================ */

db.auth.onAuthStateChange(
  function(event, session) {

    if (session) {

      document.getElementById("loginBox")
        .classList.add("hidden");

      document.getElementById("app")
        .classList.remove("hidden");

    } else {

      document.getElementById("loginBox")
        .classList.remove("hidden");

      document.getElementById("app")
        .classList.add("hidden");
    }
  }
);


/* ================================
   NAVIGATION
================================ */

function showSection(sectionId) {

  const sections =
    document.querySelectorAll(".section");

  sections.forEach(section => {
    section.classList.add("hidden");
  });

  const dashboard =
    document.querySelector(".dashboard");

  if (dashboard) {
    dashboard.classList.add("hidden");
  }

  const section =
    document.getElementById(sectionId);

  if (section) {
    section.classList.remove("hidden");
  }


  if (sectionId === "membersSection") {
    loadMembers();
  }

  if (sectionId === "executiveSection") {
    loadExecutivePeriods();
    loadExecutives();
  }

  if (sectionId === "financeSection") {
    loadFinance();
  }

  if (sectionId === "meetingsSection") {
    loadMeetings();
  }

  if (sectionId === "eventsSection") {
    loadEvents();
  }

  if (sectionId === "documentsSection") {
    loadDocuments();
  }
}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ================================
   PHOTO VALIDATION
================================ */

function validatePhoto(file) {

  if (!file) {
    return true;
  }

  if (!file.type.startsWith("image/")) {

    alert("Please select an image file.");

    return false;
  }

  const maxSize =
    5 * 1024 * 1024;

  if (file.size > maxSize) {

    alert("Photo must not be larger than 5MB.");

    return false;
  }

  return true;
}


/* ================================
   PHOTO PREVIEW
================================ */

function previewPhoto(inputId, previewId) {

  const input =
    document.getElementById(inputId);

  const preview =
    document.getElementById(previewId);

  if (!input || !preview) return;

  const file = input.files[0];

  if (!file) {

    preview.src = "";
    preview.style.display = "none";

    return;
  }

  if (!validatePhoto(file)) {

    input.value = "";

    preview.src = "";
    preview.style.display = "none";

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    preview.src = e.target.result;

    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}


/* ================================
   GET CURRENT ACCESS TOKEN
================================ */

async function getAccessToken() {

  const {
    data: { session },
    error
  } = await db.auth.getSession();

  if (error) {
    throw error;
  }

  if (!session) {
    throw new Error("You are not logged in.");
  }

  return session.access_token;
}


/* ================================
   UPLOAD PHOTO
================================ */

async function uploadPersonPhoto(
  file,
  folder,
  prefix
) {

  if (!file) {
    return null;
  }

  if (!validatePhoto(file)) {
    throw new Error("Invalid photo.");
  }

  const token =
    await getAccessToken();

  const extension =
    file.name.split(".").pop().toLowerCase();

  const fileName =
    `${prefix}-${Date.now()}-${Math.random()
      .toString(36)
      .substring(2, 9)}.${extension}`;

  const filePath =
    `${folder}/${fileName}`;

  const response =
    await fetch(
      `${SUPABASE_URL}/storage/v1/object/${DOCUMENT_BUCKET}/${filePath}`,
      {
        method: "POST",

        headers: {
          Authorization:
            `Bearer ${token}`,

          apikey:
            SUPABASE_KEY,

          "Content-Type":
            file.type
        },

        body: file
      }
    );

  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      `Photo upload failed: ${text}`
    );
  }

  return filePath;
}


/* ================================
   GET PHOTO URL
================================ */

function getPhotoUrl(path) {

  if (!path) {
    return "";
  }

  return `${SUPABASE_URL}/storage/v1/object/public/${DOCUMENT_BUCKET}/${path}`;
}


/* ================================
   DELETE STORED PHOTO
================================ */

async function deleteStoredPhoto(path) {

  if (!path) {
    return;
  }

  try {

    const token =
      await getAccessToken();

    await fetch(
      `${SUPABASE_URL}/storage/v1/object/${DOCUMENT_BUCKET}`,
      {
        method: "DELETE",

        headers: {
          Authorization:
            `Bearer ${token}`,

          apikey:
            SUPABASE_KEY,

          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          prefixes: [path]
        })
      }
    );

  } catch (error) {

    console.log(
      "Could not delete photo:",
      error
    );
  }
}


/* ================================
   MEMBERS
================================ */

async function saveMember() {

  const name =
    document.getElementById("memberName")
      .value.trim();

  const phone =
    document.getElementById("memberPhone")
      .value.trim();

  const memberType =
    document.getElementById("memberType")
      .value;

  const position =
    document.getElementById("memberPosition")
      .value.trim();

  const photoInput =
    document.getElementById("memberPhoto");

  const file =
    photoInput.files[0];

  if (!name) {

    showMessage(
      "memberMessage",
      "Please enter member name."
    );

    return;
  }

  let newPhotoPath = null;

  try {

    if (file) {

      newPhotoPath =
        await uploadPersonPhoto(
          file,
          "member-photos",
          "member"
        );
    }


    const record = {

      name,
      phone,
      position,
      member_type: memberType,
      photo_url:
        newPhotoPath ||
        editingMemberOldPhoto ||
        null
    };


    if (editingMemberId) {

      const { error } =
        await db
          .from("members")
          .update(record)
          .eq("id", editingMemberId);

      if (error) {
        throw error;
      }


      if (
        newPhotoPath &&
        editingMemberOldPhoto
      ) {

        await deleteStoredPhoto(
          editingMemberOldPhoto
        );
      }


      showMessage(
        "memberMessage",
        "Member updated successfully."
      );

    } else {

      const { error } =
        await db
          .from("members")
          .insert([record]);

      if (error) {
        throw error;
      }

      showMessage(
        "memberMessage",
        "Member saved successfully."
      );
    }

async function saveEvent() {

/* ================================
   DOCUMENTS
================================ */

async function saveDocument() {

  const title =
    document.getElementById(
      "documentTitle"
    ).value.trim();

  const fileInput =
    document.getElementById(
      "documentFile"
    );

  const file =
    fileInput.files[0];


  if (!title) {

    showMessage(
      "documentMessage",
      "Please enter document title."
    );

    return;
  }


  if (!file) {

    showMessage(
      "documentMessage",
      "Please select a document."
    );

    return;
  }


  try {

    const token =
      await getAccessToken();


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      `document-${Date.now()}.${extension}`;


    const filePath =
      `documents/${fileName}`;


    const response =
      await fetch(
        `${SUPABASE_URL}/storage/v1/object/${DOCUMENT_BUCKET}/${filePath}`,
        {
          method: "POST",

          headers: {
            Authorization:
              `Bearer ${token}`,

            apikey:
              SUPABASE_KEY,

            "Content-Type":
              file.type
          },

          body: file
        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        `Upload failed: ${text}`
      );
    }


    const { error } =
      await db
        .from("documents")
        .insert([{
          title,
          file_path: filePath
        }]);


    if (error) {
      throw error;
    }


    showMessage(
      "documentMessage",
      "Document uploaded successfully."
    );


    document.getElementById(
      "documentTitle"
    ).value = "";

    fileInput.value = "";


    await loadDocuments();


  } catch (error) {

    showMessage(
      "documentMessage",
      `Could not upload document:<br>${escapeHtml(error.message)}`
    );
  }
}
