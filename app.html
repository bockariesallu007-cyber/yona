<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YONA Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #222;
    }

    header {
      background: #075aaa;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .dashboard button {
      padding: 15px 10px;
      border: none;
      border-radius: 8px;
      background: #075aaa;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .dashboard button:hover {
      opacity: 0.9;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section {
      display: none;
    }

    .section-title {
      margin-top: 0;
      color: #075aaa;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      margin: 5px 3px;
      background: #075aaa;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .delete-button {
      background: #d93025;
    }

    .cancel-button {
      background: #777;
    }

    .back-button {
      background: #333;
      margin-top: 15px;
    }

    .message {
      padding: 10px;
      margin: 10px 0;
      background: #f1f1f1;
      border-radius: 6px;
    }

    .member-card,
    .executive-card,
    .finance-card,
    .event-card {
      background: #f8fafc;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
    }

    .member-card h3,
    .executive-card h3,
    .event-card h3 {
      margin-top: 0;
      color: #075aaa;
    }

    .finance-amount {
      font-weight: bold;
      font-size: 18px;
    }

    .event-date {
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>YOUTHS OF NDASEI ASSOCIATION</h1>
  <p>Admin Management System</p>
</header>

<div class="container">

  <!-- DASHBOARD -->

  <div class="card">
    <h2>Dashboard</h2>

    <div class="dashboard">

      <button onclick="showExecutive()">

      <button onclick="showFinance()">

        id="memberPhone"
        type="text"
        placeholder="Phone"
      >

      <input

        placeholder="Position"

        onclick="cancelEdit()"
        style="display:none;"
      >
        Cancel Edit
      </button>

      <div id="membersList"></div>

      <button
        class="back-button"
        onclick="location.reload()"

        Back to Dashboard
      </button>

    </div>

  </div>


  <!-- EXECUTIVE -->

  <div id="executiveSection" class="section">

      <div id="executiveList"></div>

      <button

        Back to Dashboard

    </div>

  </div>


  <!-- FINANCE -->

    <div class="card">

      <h2 class="section-title">
        Finance

      <input

          Loan

        <option value="Loan Repayment">

========================= */

function hideAllSections() {

  document.getElementById("membersSection").style.display = "none";

  document.getElementById("executiveSection").style.display = "none";

  document.getElementById("financeSection").style.display = "none";

  document.getElementById("meetingsSection").style.display = "none";

  document.getElementById("eventsSection").style.display = "none";

  document.getElementById("documentsSection").style.display = "none";
}


function showMembers() {

  hideAllSections();

  document.getElementById("membersSection").style.display = "block";

  loadMembers();
}


function showExecutive() {

  hideAllSections();

  document.getElementById("executiveSection").style.display = "block";

}


function showFinance() {

}


function showMeetings() {

function showDocuments() {

/* =========================
   MEMBERS
========================= */

async function loadMembers() {

  const list =
    document.getElementById("membersList");

  list.innerHTML = "<p>Loading members...</p>";

  const { data, error } =
    await db
      .from("members")
      .select("*")
      .order("id", { ascending: false });

  if (error) {

    list.innerHTML =
      "<p class='message'>Error loading members: " +
      escapeHtml(error.message) +
      "</p>";

    return;
  }

  if (!data || data.length === 0) {

    list.innerHTML =
      "<p>No members found.</p>";

    return;
  }

  list.innerHTML =
    data.map(member => {

      const name =
        readJsonValue(member.name);

      const phone =
        readJsonValue(member.phone);

      const position =
        readJsonValue(member.position);

      return `
        <div class="member-card">

          <h3>${escapeHtml(name)}</h3>

          <p>
            <strong>Phone:</strong>
            ${escapeHtml(phone)}
          </p>

          <p>
            <strong>Position:</strong>
            ${escapeHtml(position)}
          </p>

          <button
            onclick="editMember(
              '${escapeJs(member.id)}',
              '${escapeJs(name)}',
              '${escapeJs(phone)}',
              '${escapeJs(position)}'
            )"
          >
            Edit
          </button>

          <button
            class="delete-button"
            onclick="deleteMember('${escapeJs(member.id)}')"
          >
            Delete
          </button>

        </div>
      `;

    }).join("");
}


async function addMember() {

  const name =
    document.getElementById("memberName").value.trim();

  const phone =
    document.getElementById("memberPhone").value.trim();

  const position =
    document.getElementById("memberPosition").value.trim();

  if (!name) {

    alert("Please enter the member name.");

    return;
  }

  const { error } =
    await db
      .from("members")
      .insert([{

        name: JSON.stringify(name),

        phone: JSON.stringify(phone),

        position: JSON.stringify(position)

      }]);

  if (error) {

    alert(
      "Error adding member: " +
      error.message
    );

    return;
  }

  clearMemberForm();

  loadMembers();
}


function editMember(
  id,
  name,
  phone,
  position
) {

  editingMemberId = id;

  document.getElementById("memberName").value =
    name;

  document.getElementById("memberPhone").value =
    phone;

  document.getElementById("memberPosition").value =
    position;

  document.getElementById("saveMemberButton").textContent =
    "Update Member";

  document.getElementById("saveMemberButton").onclick =
    updateMember;

  document.getElementById("cancelMemberButton").style.display =
    "inline-block";
}


async function updateMember() {

  const name =
    document.getElementById("memberName").value.trim();

  const phone =
    document.getElementById("memberPhone").value.trim();

  const position =
    document.getElementById("memberPosition").value.trim();

  const { error } =
    await db
      .from("members")
      .update({

        name: JSON.stringify(name),

        phone: JSON.stringify(phone),

        position: JSON.stringify(position)

      })
      .eq("id", editingMemberId);

  if (error) {

    alert(
      "Error updating member: " +
      error.message
    );

    return;
  }

  cancelEdit();

  loadMembers();
}


function cancelEdit() {

  editingMemberId = null;

  clearMemberForm();

  document.getElementById("saveMemberButton").textContent =
    "Add Member";

  document.getElementById("saveMemberButton").onclick =
    addMember;

  document.getElementById("cancelMemberButton").style.display =
    "none";
}


async function deleteMember(id) {

  if (!confirm("Are you sure you want to delete this member?")) {
    return;
  }

  const { error } =
    await db
      .from("members")
      .delete()
      .eq("id", id);

  if (error) {

    alert(
      "Error deleting member: " +
      error.message
    );

    return;
  }

  loadMembers();
}


function clearMemberForm() {

  document.getElementById("memberName").value = "";

  document.getElementById("memberPhone").value = "";

  document.getElementById("memberPosition").value = "";
}

        <div class="event-card">

          <h3>
            ${escapeHtml(event.title || "")}
          </h3>

          <p class="event-date">
            Date:
            ${escapeHtml(event.date || "")}
          </p>

          <p>
            <strong>Location:</strong>
            ${escapeHtml(event.location || "")}
          </p>

          <p>
            <strong>Description:</strong><br>
            ${escapeHtml(event.description || "")}
          </p>

          <button
            onclick="editEvent(
              '${escapeJs(event.id)}',
              '${escapeJs(event.title || "")}',
              '${escapeJs(event.date || "")}',
              '${escapeJs(event.location || "")}',
              '${escapeJs(event.description || "")}'
            )"
          >
            Edit Event
          </button>

          <button
            class="delete-button"
            onclick="deleteEvent('${escapeJs(event.id)}')"
          >
            Delete Event
          </button>

        </div>
      `;

    }).join("");
}


async function addEvent() {

  const title =
    document.getElementById("eventTitle").value.trim();

  const date =
    document.getElementById("eventDate").value;

  const location =
    document.getElementById("eventLocation").value.trim();

  const description =
    document.getElementById("eventDescription").value.trim();

  if (!title || !date) {

    alert(
      "Please enter the Event Title and Date."
    );

    return;
  }

  const { error } =
    await db
      .from("events")
      .insert([{

        title: title,

        date: date,

        location: location,

        description: description

      }]);

  if (error) {

    alert(
      "Error adding event: " +
      error.message
    );

    return;
  }

  alert("Event added successfully.");

  clearEventForm();

  loadEvents();
}


function editEvent(
  id,
  title,
  date,
  location,
  description
) {

  editingEventId = id;

  document.getElementById("eventTitle").value =
    title;

  document.getElementById("eventDate").value =
    date;

  document.getElementById("eventLocation").value =
    location;

  document.getElementById("eventDescription").value =
    description;

  document.getElementById("saveEventButton").textContent =
    "Update Event";

  document.getElementById("saveEventButton").onclick =
    updateEvent;

  document.getElementById("cancelEventButton").style.display =
    "inline-block";
}


async function updateEvent() {

  const title =
    document.getElementById("eventTitle").value.trim();

  const date =
    document.getElementById("eventDate").value;

  const location =
    document.getElementById("eventLocation").value.trim();

  const description =
    document.getElementById("eventDescription").value.trim();

  if (!title || !date) {

    alert(
      "Please enter the Event Title and Date."
    );

    return;
  }

  const { error } =
    await db
      .from("events")
      .update({

        title: title,

        date: date,

        location: location,

        description: description

      })
      .eq("id", editingEventId);

  if (error) {

    alert(
      "Error updating event: " +
      error.message
    );

    return;
  }

  alert("Event updated successfully.");

  cancelEventEdit();

  loadEvents();
}


function cancelEventEdit() {

  editingEventId = null;

  clearEventForm();

  document.getElementById("saveEventButton").textContent =
    "Add Event";

  document.getElementById("saveEventButton").onclick =
    addEvent;

  document.getElementById("cancelEventButton").style.display =
    "none";
}


async function deleteEvent(id) {

  if (!confirm(
    "Are you sure you want to delete this event?"
  )) {
    return;
  }

  const { error } =
    await db
      .from("events")
      .delete()
      .eq("id", id);

  if (error) {

    alert(
      "Error deleting event: " +
      error.message
    );

    return;
  }

  alert("Event deleted successfully.");

  loadEvents();
}


function clearEventForm() {

  document.getElementById("eventTitle").value = "";

  document.getElementById("eventDate").value = "";

  document.getElementById("eventLocation").value = "";

  document.getElementById("eventDescription").value = "";
}


/* =========================
   HELPERS
========================= */

function readJsonValue(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  try {

    const parsed =
      JSON.parse(value);

    if (
      typeof parsed === "string"
    ) {
      return parsed;
    }

    return String(parsed);

  } catch {

    return String(value);
  }
}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeJs(value) {

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      '\\"'
    )

    .replace(
      /\n/g,
      "\\n"
    )

    .replace(
      /\r/g,
      "\\r"
    );
}
