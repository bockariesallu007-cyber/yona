<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YONA App</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f8;
  color: #222;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* LOGIN */

#loginScreen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #075eaa, #0b7bc1);
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.login-box h1 {
  text-align: center;
  color: #075eaa;
  margin-bottom: 5px;
}

.login-box p {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

/* HEADER */

header {
  background: #075eaa;
  color: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-title h1 {
  margin: 0;
  font-size: 22px;
}

.header-title small {
  opacity: .9;
}

.logout-btn {
  background: white;
  color: #075eaa;
  border: none;
  padding: 9px 14px;
  border-radius: 7px;
  font-weight: bold;
}

/* DASHBOARD */

.dashboard {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.dashboard-cards {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.dashboard-card {
  background: white;
  border-radius: 10px;
  padding: 15px 8px;
  text-align: center;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow: 0 2px 7px rgba(0,0,0,.08);
}

.dashboard-card:hover {
  border-color: #075eaa;
}

.dashboard-card.active {
  background: #075eaa;
  color: white;
}

.dashboard-card .number {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 5px;
}

/* SECTIONS */

.section {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  margin-bottom: 25px;
}

.section.active {
  display: block;
}

.section h2 {
  color: #075eaa;
  margin-top: 0;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: 1 / -1;
}

label {
  font-weight: bold;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.form-buttons {
  margin-top: 15px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  font-weight: bold;
}

.btn-primary {
  background: #075eaa;
  color: white;
}

.btn-secondary {
  background: #777;
  color: white;
}

.btn-danger {
  background: #d93025;
  color: white;
}

.btn-success {
  background: #198754;
  color: white;
}

/* RECORDS */

.records {
  margin-top: 25px;
}

.record-card {
  background: #f8fafc;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
}

.record-with-photo {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.record-info {
  flex: 1;
}

.record-card h3 {
  margin: 0 0 6px;
  color: #075eaa;
}

.record-card p {
  margin: 4px 0;
}

.record-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* PHOTOS */

.profile-photo {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #e8f2fb;
  flex-shrink: 0;
}

.photo-placeholder {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #e8f2fb;
  color: #075eaa;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: bold;
  font-size: 11px;
  flex-shrink: 0;
}

.photo-preview {
  margin-top: 10px;
}

.photo-preview img {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #e8f2fb;
}

/* CATEGORY / PERIOD */

.category-heading,
.period-heading {
  background: #075eaa;
  color: white;
  padding: 10px 12px;
  border-radius: 7px;
  margin-top: 20px;
  margin-bottom: 10px;
}

.category-heading h3,
.period-heading h3 {
  margin: 0;
}

.category-total {
  font-weight: bold;
  margin: 8px 0;
  color: #075eaa;
}

/* MESSAGE */

.message {
  padding: 10px;
  border-radius: 7px;
  margin: 10px 0;
  display: none;
}

.message.success {
  background: #d1e7dd;
  color: #0f5132;
  display: block;
}

.message.error {
  background: #f8d7da;
  color: #842029;
  display: block;
}

/* RESPONSIVE */

@media (max-width: 900px) {
  .dashboard-cards {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 600px) {

  header {
    align-items: flex-start;
  }

  .dashboard {
    padding: 10px;
  }

  .section {
    padding: 15px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: auto;
  }

  .dashboard-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .record-with-photo {
    align-items: flex-start;
  }
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://atxeeymireukwbbsczbv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qc3DSCrNuXWmeVOqK_CKoQ_Z_CitoTc";


/*
 IMPORTANT

 The Storage bucket must exist in Supabase.

 Exact bucket name:
 yona-document

 Photos are stored inside:

 yona-document/member-photos/
 yona-document/executive-photos/

 Documents remain in the root of the bucket.
*/

const DOCUMENT_BUCKET =
  "yona-document";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let editingMemberId = null;
let editingExecutiveId = null;
let editingFinanceId = null;
let editingMeetingId = null;
let editingEventId = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function showMessage(
  id,
  message,
  type = "success"
) {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.textContent =
    message;

  element.className =
    "message " + type;

  setTimeout(() => {

    element.className =
      "message";

    element.textContent =
      "";

  }, 4000);
}


/* =========================================================
   STORAGE CHECK
========================================================= */

async function checkPhotoBucket() {

  const {
    data,
    error
  } = await db.storage
    .listBuckets();

  if (error) {

    console.error(
      "Storage check error:",
      error.message
    );

    return false;
  }

  const bucketExists =
    (data || []).some(
      bucket =>
        bucket.id === DOCUMENT_BUCKET ||
        bucket.name === DOCUMENT_BUCKET
    );

  return bucketExists;
}


/* =========================================================
   AUTH
========================================================= */

async function checkUser() {

  const {
    data
  } = await db.auth.getSession();

  if (data.session) {

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    await loadAll();

  } else {

    document
      .getElementById("loginScreen")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

  }
}


async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Please enter email and password.",
      "error"
    );

    return;
  }


  const {
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });


  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;
  }


  await checkUser();
}


async function logout() {

  await db.auth.signOut();

  location.reload();
}


/* =========================================================
   NAVIGATION
========================================================= */

async function showSection(
  sectionId,
  card
) {

  document
    .querySelectorAll(".section")
    .forEach(section => {

      section.classList.remove(
        "active"
      );

    });


  const section =
    document.getElementById(
      sectionId
    );


  if (section) {

    section.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      ".dashboard-card"
    )
    .forEach(item => {

      item.classList.remove(
        "active"
      );

    });


  if (card) {

    card.classList.add(
      "active"
    );

  }


  if (sectionId === "members") {
    await loadMembers();
  }


  if (sectionId === "executive") {

    await loadExecutivePeriods();

    await loadExecutive();

  }


  if (sectionId === "finance") {
    await loadFinance();
  }


  if (sectionId === "meetings") {
    await loadMeetings();
  }


  if (sectionId === "events") {
    await loadEvents();
  }


  if (sectionId === "documents") {
    await loadDocuments();
  }
}


/* =========================================================
   PHOTO FUNCTIONS
========================================================= */

function validatePhoto(file) {

  if (!file) {
    return true;
  }


  if (!file.type.startsWith("image/")) {

    alert(
      "Please select an image file."
    );

    return false;
  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    alert(
      "Photo is too large. Maximum size is 5 MB."
    );

    return false;
  }


  return true;

function previewPhoto(
  inputId,
  previewId
) {

  const input =
    document.getElementById(
      inputId
    );

  const preview =
    document.getElementById(
      previewId
    );


  if (!input || !preview) {
    return;
  }


  const file =
    input.files[0];


  if (!file) {

    preview.innerHTML =
      "";

    return;
  }


  if (!validatePhoto(file)) {

    input.value =
      "";

    preview.innerHTML =
      "";

    return;
  }


  const url =
    URL.createObjectURL(file);


  preview.innerHTML =
    `<img
      src="${url}"
      alt="Photo preview"
    >`;
}


async function uploadPersonPhoto(
  file,
  folder,
  prefix
) {

  if (!file) {
    return null;
  }


  if (!validatePhoto(file)) {

    throw new Error(
      "Invalid photo."
    );

  }


  /*
   First confirm the bucket exists.
  */

  const bucketExists =
    await checkPhotoBucket();


  if (!bucketExists) {

    throw new Error(
      'Storage bucket "yona-document" was not found. Please create a Supabase Storage bucket named exactly "yona-document".'
    );

  }


  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const path =
    `${folder}/${prefix}_${Date.now()}_${Math.random()
      .toString(36)
      .slice(2, 8)}_${safeName}`;


  const {
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .upload(
      path,
      file,
      {
        upsert: false
      }
    );


  if (error) {

    throw error;

  }


  return path;
}


async function getPhotoUrl(path) {

  if (!path) {
    return "";
  }


  const {
    data,
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .createSignedUrl(
      path,
      3600
    );


  if (error) {

    console.error(
      "Photo URL error:",
      error.message
    );

    return "";

  }


  return (
    data?.signedUrl ||
    ""
  );
}


async function deleteStoredPhoto(
  path
) {

  if (!path) {
    return;
  }


  const {
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .remove([
      path
    ]);


  if (error) {

    console.warn(
      "Could not delete photo:",
      error.message
    );

  }
}

async function saveMember() {

  const name =
    document
      .getElementById(
        "memberName"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "memberPhone"
      )
      .value
      .trim();


  const memberType =
    document
      .getElementById(
        "memberType"
      )
      .value;


  const position =
    document
      .getElementById(
        "memberPosition"
      )
      .value
      .trim();


  const photoInput =
    document.getElementById(
      "memberPhoto"
    );


  const photoFile =
    photoInput.files[0];


  if (!name) {

    showMessage(
      "memberMessage",
      "Please enter member name.",
      "error"
    );

    return;
  }


  try {

    let oldPhoto =
      null;


    if (editingMemberId) {

      const {
        data: oldMember
      } = await db
        .from("members")
        .select("photo_url")
        .eq(
          "id",
          editingMemberId
        )
        .single();


      oldPhoto =
        oldMember?.photo_url ||
        null;

    }


    let newPhotoPath =
      oldPhoto;


    if (photoFile) {

      newPhotoPath =
        await uploadPersonPhoto(
          photoFile,
          "member-photos",
          "member"
        );

    }


    const record = {

      name,

      phone,

      position,

      member_type:
        memberType,

      photo_url:
        newPhotoPath

    };


    let error;


    if (editingMemberId) {

      ({
        error
      } = await db
        .from("members")
        .update(record)
        .eq(
          "id",
          editingMemberId
        ));

    } else {

      ({
        error
      } = await db
        .from("members")
        .insert(record));

    }


    if (error) {

      if (
        photoFile &&
        newPhotoPath &&
        newPhotoPath !== oldPhoto
      ) {

        await deleteStoredPhoto(
          newPhotoPath
        );

      }


      throw error;

    }


    if (
      photoFile &&
      oldPhoto &&
      oldPhoto !== newPhotoPath
    ) {

      await deleteStoredPhoto(
        oldPhoto
      );

    }


    showMessage(
      "memberMessage",
      editingMemberId
        ? "Member updated successfully."
        : "Member saved successfully."
    );


    clearMemberForm();


    await loadMembers();

  } catch (error) {

    console.error(error);


    showMessage(
      "memberMessage",

    );

}

/* =========================================================
   DOCUMENTS
========================================================= */

async function loadDocuments() {

  const {
    data,
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .list("");


  if (error) {

    showMessage(
      "documentMessage",
      error.message,
      "error"
    );

    return;
  }


  /*
    Only root-level files are shown.

    member-photos and executive-photos
    are ignored.
  */

  const files =
    (data || []).filter(
      file =>
        file.name &&
        file.id &&
        !file.name.includes("/")
    );


  document.getElementById(
    "documentCount"
  ).textContent =
    files.length;


  const list =
    document.getElementById(
      "documentsList"
    );


  list.innerHTML =
    "";


  if (!files.length) {

    list.innerHTML =
      "<p>No documents uploaded.</p>";

    return;
  }


  files.forEach(
    file => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "record-card";


      card.innerHTML = `

        <h3>
          ${escapeHtml(
            file.name
          )}
        </h3>


        <div
          class="record-actions"
        >

          <button
            class="btn btn-primary"
            onclick="openFile('${escapeHtml(file.name)}')"
          >
            Open
          </button>


          <button
            class="btn btn-danger"
            onclick="deleteFile('${escapeHtml(file.name)}')"
          >
            Delete
          </button>

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );

}


async function uploadDocument() {

  const file =
    document
      .getElementById(
        "documentFile"
      )
      .files[0];


  if (!file) {

    showMessage(
      "documentMessage",
      "Please select a file.",
      "error"
    );

    return;
  }


  const {
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .upload(
      file.name,
      file,
      {
        upsert: false
      }
    );


  if (error) {

    showMessage(
      "documentMessage",
      "Could not upload document: " +
      error.message,
      "error"
    );

    return;
  }


  document.getElementById(
    "documentTitle"
  ).value =
    "";


  document.getElementById(
    "documentType"
  ).value =
    "";


  document.getElementById(
    "documentFile"
  ).value =
    "";


  showMessage(
    "documentMessage",
    "Document uploaded successfully."
  );


  await loadDocuments();
}


async function openFile(
  fileName
) {

  const {
    data,
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .createSignedUrl(
      fileName,
      3600
    );


  if (error) {

    showMessage(
      "documentMessage",
      error.message,
      "error"
    );

    return;
  }


  window.open(
    data.signedUrl,
    "_blank"
  );
}


async function deleteFile(
  fileName
) {

  if (
    !confirm(
      "Delete this document?"
    )
  ) {
    return;
  }


  const {
    error
  } = await db.storage
    .from(DOCUMENT_BUCKET)
    .remove([
      fileName
    ]);


  if (error) {

    showMessage(
      "documentMessage",
      error.message,
      "error"
    );

    return;
  }


  await loadDocuments();
}

/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (session) {

      document
        .getElementById(
          "loginScreen"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "app"
        )
        .classList.remove(
          "hidden"
        );


      await loadAll();

    } else {

      document
        .getElementById(
          "loginScreen"
        )
        .classList.remove(
          "hidden"
        );


      document
        .getElementById(
          "app"
        )
        .classList.add(
          "hidden"
        );

    }

  }
);
